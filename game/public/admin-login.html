<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WashindiHub — Admin Access</title>
<style>
:root { --bg: #0b0f19; --panel: rgba(20, 25, 40, 0.85); --border: rgba(255, 255, 255, 0.08); --red: #ff3344; --text: #ffffff; --muted: #8b92a5; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
.logo { font-size: 20px; font-weight: 900; text-align: center; margin-bottom: 20px; color: var(--red); letter-spacing: 2px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; }
input { background: rgba(0,0,0,.3); border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 10px; font-size: 16px; outline: none; }
input:focus { border-color: var(--red); }
.btn { width: 100%; border: none; border-radius: 10px; padding: 15px; font-size: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; background: linear-gradient(135deg, #ff3344, #cc1122); color: white; }
.btn:hover { transform: translateY(-2px); }
.error { color: var(--red); font-size: 13px; text-align: center; margin-top: 10px; display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">ADMIN ACCESS</div>
  <div class="field">
    <label>Admin Password</label>
    <input id="adminPw" type="password" placeholder="Enter admin password">
  </div>
  <button class="btn" onclick="loginAdmin()">Access Dashboard</button>
  <div class="error" id="err"></div>
</div>

<script>
async function loginAdmin() {
  const pw = document.getElementById('adminPw').value;
  if (!pw) return showErr('Enter password');
  
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const j = await r.json();
    if (!r.ok) return showErr(j.error || 'Login failed');
    
    localStorage.setItem('adminPassword', pw);
    localStorage.setItem('adminRole', j.role);
    window.location.href = '/admin.html';
  } catch (e) {
    showErr('Network error');
  }
}

function showErr(msg) {
  const e = document.getElementById('err');
  e.textContent = msg;
  e.style.display = 'block';
}
</script>
</body>
</html>
